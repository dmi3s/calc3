name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: jotrorox/setup-c3@v1

    - name: Test README sync (fails on divergence)
      run: python3 scripts/check_readme_sync --strict

    - name: Build project
      run: c3c build

    - name: Run tests
      run: c3c test
