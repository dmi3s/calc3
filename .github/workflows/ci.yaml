name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: jotrorox/setup-c3@v1

    - name: Test README sync (fails on divergence)
      run: python3 scripts/check_readme_sync --strict

    - name: Build project
      run: c3c build

    - name: Run tests
      run: c3c test

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install d2
      run: |
        curl -fsSL https://d2lang.com/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install typst
      run: |
        TYPST_VER=0.11.1
        curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VER}/typst-x86_64-unknown-linux-musl.tar.xz" -o typst.tar.xz
        tar -xJf typst.tar.xz
        sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

    - name: Build documentation
      run: make docs

    - name: Check docs translation sync (fails on divergence)
      run: python3 scripts/check_docs_sync --strict

    - name: Upload PDFs
      uses: actions/upload-artifact@v4
      with:
        name: docs-pdf
        path: docs/*.pdf
